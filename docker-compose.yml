name: unified-inbox

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unify}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unify}
      POSTGRES_DB: ${POSTGRES_DB:-unify}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unify} -d ${POSTGRES_DB:-unify}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    # 变量全部由同目录 .env 插值（compose 自动读取），没填就是空 -> 该平台显示"未就绪"，
    # 不会导致启动失败，方便评委在没有凭证的机器上先看架构。
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-unify}:${POSTGRES_PASSWORD:-unify}@db:5432/${POSTGRES_DB:-unify}
      REDIS_URL: redis://redis:6379/0
      TZ: Asia/Shanghai
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BASE_URL: ${FEISHU_BASE_URL:-https://open.feishu.cn}
      DINGTALK_CLIENT_ID: ${DINGTALK_CLIENT_ID:-}
      DINGTALK_CLIENT_SECRET: ${DINGTALK_CLIENT_SECRET:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      OUTBOX_WORKERS: ${OUTBOX_WORKERS:-2}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      SLA_MINUTES: ${SLA_MINUTES:-15}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # ---- 安全配置：这几项漏传会有实际后果，不是可选装饰 ----
      # ACCESS_PASSWORD 不传 = 谁连上 8080 都能看消息、能代发。
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
      ACCESS_COOKIE_DAYS: ${ACCESS_COOKIE_DAYS:-30}
      # SECRET_KEY 用于派生 token 加密密钥（Fernet）和登录 cookie 签名。
      # 不传就用代码里的默认值 —— 那等于把加密密钥公开写在仓库里，密文形同明码。
      SECRET_KEY: ${SECRET_KEY:-dev-only-change-me-in-env}
      # OAuth 回调地址必须和飞书后台登记的完全一致，硬编码 127.0.0.1 在容器里跑不通。
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://127.0.0.1:8000/api/v1/auth/feishu/callback}
      FEISHU_USER_SCOPES: ${FEISHU_USER_SCOPES:-im:message:readonly im:chat:readonly}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 出站附件暂存在这里。不挂卷的话：文件进了 Outbox 队列 → 容器重启 →
      # 数据库里还有待发任务，磁盘上文件没了 → 永远发不出去。
      - uploads:/srv/uploads
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
